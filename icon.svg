<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa8f5"/><stop offset="1" stop-color="#8fdcff"/>
    </linearGradient>
    <radialGradient id="pit" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#05070d"/><stop offset="0.75" stop-color="#121a33"/><stop offset="1" stop-color="#26335c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#2fd3b9" stop-opacity="0.9"/><stop offset="1" stop-color="#2fd3b9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inHole">
      <rect x="0" y="0" width="1024" height="655"/>
      <ellipse cx="512" cy="655" rx="318" ry="132"/>
    </clipPath>
  </defs>

  <!-- Himmel mit Comic-Strahlen -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.16">
    <path d="M512 560 L380 -40 L560 -40 Z"/><path d="M512 560 L760 -40 L940 -40 Z"/>
    <path d="M512 560 L1080 120 L1080 300 Z"/><path d="M512 560 L1080 560 L1080 720 Z"/>
    <path d="M512 560 L-60 120 L-60 -40 L80 -40 Z"/><path d="M512 560 L-60 420 L-60 600 Z"/>
  </g>

  <!-- Boden -->
  <ellipse cx="512" cy="760" rx="720" ry="330" fill="#7ed957" stroke="#1d2433" stroke-width="14"/>
  <g stroke="#5fb83f" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M150 880 l14 -22 l14 22"/><path d="M860 860 l14 -22 l14 22"/><path d="M780 960 l14 -22 l14 22"/><path d="M230 990 l14 -22 l14 22"/>
  </g>

  <!-- Loch: Leuchten, Innenraum, hinterer Rand -->
  <ellipse cx="512" cy="655" rx="410" ry="190" fill="url(#glow)"/>
  <ellipse cx="512" cy="655" rx="330" ry="140" fill="url(#pit)"/>
  <path d="M182 655 A330 140 0 0 1 842 655" fill="none" stroke="#1d2433" stroke-width="58"/>
  <path d="M182 655 A330 140 0 0 1 842 655" fill="none" stroke="#2fd3b9" stroke-width="34"/>
  <path d="M200 640 A314 126 0 0 1 824 640" fill="none" stroke="#9ff3e4" stroke-width="8" stroke-linecap="round"/>

  <!-- Auto kippt ins Loch -->
  <g clip-path="url(#inHole)">
    <g transform="translate(530 640) rotate(32)" stroke="#1d2433" stroke-width="14" stroke-linejoin="round">
      <rect x="-190" y="-60" width="380" height="130" rx="52" fill="#ff5a4e"/>
      <path d="M-110 -60 Q-95 -150 -10 -150 L60 -150 Q120 -150 130 -60 Z" fill="#a8dcf5"/>
      <rect x="-118" y="-162" width="250" height="26" rx="13" fill="#ff5a4e"/>
      <line x1="10" y1="-148" x2="10" y2="-62"/>
      <path d="M-40 -130 L-80 -70" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-110" cy="72" r="46" fill="#2a2d36"/><circle cx="-110" cy="72" r="20" fill="#d9dde5"/>
      <circle cx="115" cy="72" r="46" fill="#2a2d36"/><circle cx="115" cy="72" r="20" fill="#d9dde5"/>
      <circle cx="183" cy="-8" r="20" fill="#fff6c8"/>
    </g>
  </g>

  <!-- vorderer Rand liegt über dem Auto -->
  <path d="M182 655 A330 140 0 0 0 842 655" fill="none" stroke="#1d2433" stroke-width="58"/>
  <path d="M182 655 A330 140 0 0 0 842 655" fill="none" stroke="#2fd3b9" stroke-width="34"/>
  <path d="M230 700 A300 118 0 0 0 794 700" fill="none" stroke="#1a9f8a" stroke-width="10" stroke-linecap="round"/>

  <!-- fliegender Kleinkram + Bewegungslinien -->
  <g stroke="#1d2433" stroke-width="12" stroke-linejoin="round">
    <g transform="translate(250 330) rotate(-30)">
      <path d="M0 -70 L38 50 L-38 50 Z" fill="#ff8a3d"/><rect x="-55" y="46" width="110" height="22" rx="8" fill="#ff8a3d"/>
      <path d="M-18 -8 L18 -8" stroke="#ffffff" stroke-width="16"/>
    </g>
    <g transform="translate(800 300) rotate(22)">
      <rect x="-48" y="-62" width="96" height="124" rx="16" fill="#3fae6b"/><rect x="-58" y="-78" width="116" height="26" rx="10" fill="#2b7a4b"/>
    </g>
  </g>
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="170" y1="250" x2="130" y2="200"/><line x1="215" y1="225" x2="190" y2="170"/>
    <line x1="880" y1="210" x2="920" y2="160"/><line x1="835" y1="190" x2="855" y2="135"/>
  </g>
</svg>
