<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4fb8ff">
<meta name="apple-mobile-web-app-title" content="Lochfrass">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Lochfrass!</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd6ff; touch-action: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #1d2433; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 18px 0; }
  .pill { display: inline-block; background: #fff; border: 3px solid #1d2433; border-radius: 999px; padding: 5px 16px;
    font-weight: 900; font-size: 22px; box-shadow: 0 4px 0 #1d2433; }
  #top { display: flex; gap: 10px; align-items: center; }
  #time.warn { background: #ff5a4e; color: #fff; }
  #sizeBox, #bossBox { margin-top: 12px; width: 230px; }
  #bossTxt { font-weight: 900; font-size: 14px; color: #ffd23f; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; }
  #bossBar { background: #ff5a4e !important; }
  #bossBox.ready #bossBar { background: #ffd23f !important; }
  #arrow { position: fixed; width: 0; height: 0; display: none; pointer-events: none; }
  #arrow i { position: absolute; left: -26px; top: -22px; width: 52px; height: 44px; background: #ffd23f;
    clip-path: polygon(0 20%, 55% 20%, 55% 0, 100% 50%, 55% 100%, 55% 80%, 0 80%); filter: drop-shadow(0 0 0 #1d2433); }
  #arrow b { position: absolute; left: -40px; top: 24px; width: 80px; text-align: center; font-size: 13px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; }
  #tier { font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; display: flex; justify-content: space-between; }
  #tier small { font-size: 13px; color: #ffd23f; }
  #sizeBox .bar { height: 18px; position: relative; }
  #xpTxt { position: absolute; inset: 0; text-align: center; font-size: 11px; font-weight: 900; line-height: 13px; color: #fff;
    -webkit-text-stroke: 3px #1d2433; paint-order: stroke fill; }
  #sizeBox.up .bar { animation: lvlup .6s ease-out; }
  @keyframes lvlup { 30% { transform: scale(1.12); box-shadow: 0 0 0 6px #ffd23f; } }
  .bar { height: 14px; background: #fff; border: 3px solid #1d2433; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; background: #2fd3b9; transition: width .2s; }
  #board { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 18px; background: #fff; border: 3px solid #1d2433;
    border-radius: 16px; padding: 8px 14px; min-width: 190px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #1d2433; }
  #board div { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  #board .me { color: #0f9c86; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; border: 2px solid #1d2433; vertical-align: -1px; }
  .tag { position: fixed; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; color: #fff;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; white-space: nowrap; pointer-events: none; }
  .tag.prey { color: #8ef05a; font-size: 17px; }
  .tag.danger { color: #ff5a4e; font-size: 17px; }
  .pop { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 26px; color: #fff;
    -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; pointer-events: none; animation: up .8s ease-out forwards; }
  @keyframes up { 0% { transform: translate(-50%, -50%) scale(.6); } 25% { transform: translate(-50%, -80%) scale(1.15); } 100% { transform: translate(-50%, -170%) scale(1); opacity: 0; } }
  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 900;
    color: #ffd23f; -webkit-text-stroke: 8px #1d2433; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #joy { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.85); background: rgba(255,255,255,.18); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: #fff; border: 3px solid #1d2433; }
  #overlay { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(20,40,70,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { background: #fff; border: 4px solid #1d2433; border-radius: 30px; padding: 26px 34px; text-align: center; width: 560px; max-width: 100%;
    box-shadow: 0 10px 0 #1d2433; max-height: 100%; overflow: auto; }
  .card h1 { margin: 0; font-size: 60px; letter-spacing: -1px; color: #2fd3b9; -webkit-text-stroke: 9px #1d2433; paint-order: stroke fill; line-height: 1.1; }
  .card p { font-size: 18px; line-height: 1.4; margin: 8px 0; }
  .card .small { font-size: 14px; color: #6b7385; }
  .lvl { font-weight: 900; font-size: 20px !important; }
  .sec { font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #6b7385; margin: 18px 0 8px;
    display: flex; justify-content: space-between; }
  .tot { color: #e0a400; }
  .seg { display: flex; gap: 8px; }
  .segb, .sk, .go { font: inherit; cursor: pointer; border: 3px solid #1d2433; }
  .segb { flex: 1; background: #fff; border-radius: 16px; padding: 8px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 #1d2433; color: #1d2433; }
  .segb small { display: block; color: #ffc21a; font-size: 18px; letter-spacing: 2px; -webkit-text-stroke: 1px #1d2433; }
  .segb.on { background: #2fd3b9; }
  .skins { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .sk { background: none; border: 0; padding: 4px 0; border-radius: 14px; color: #1d2433; }
  .sk i { display: block; width: 50px; height: 50px; margin: 0 auto; border-radius: 50%; position: relative; border: 3px solid #1d2433; }
  .sk i::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #1d2433; }
  .sk small { display: block; font-size: 11px; font-weight: 800; margin-top: 4px; }
  .sk.on { background: #d9f7f1; outline: 3px solid #2fd3b9; }
  .sk.lock { opacity: .4; cursor: default; }
  .sk.lock i { filter: grayscale(1); }
  .go { background: #2fd3b9; color: #fff; font-weight: 900; font-size: 26px; border-radius: 999px; padding: 12px 46px; margin-top: 18px;
    box-shadow: 0 6px 0 #1d2433; -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; }
  .go:active, .segb:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d2433; }
  .stars { font-size: 54px; letter-spacing: 6px; color: #ffc21a; -webkit-text-stroke: 3px #1d2433; margin: 4px 0; }
  .stars .off { color: #e3e6ee; }
  #ranks { text-align: left; margin: 10px auto; font-weight: 800; font-size: 17px; max-width: 260px; }
  #ranks div { display: flex; justify-content: space-between; padding: 2px 0; }
  .unlock { background: #fff6d6; border: 3px dashed #e0a400; border-radius: 14px; padding: 8px; font-weight: 900; margin: 10px 0; }
  /* Ton-Knopf: liegt immer oben links, auch über dem Menü */
  #snd { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 18px; z-index: 5; pointer-events: auto; cursor: pointer;
    width: 50px; height: 43px; padding: 0; display: flex; align-items: center; justify-content: center; font: inherit; color: #1d2433; }
  #snd .x, #snd.off .w { display: none; }
  #snd.off .x { display: inline; }
  #top { padding-left: 60px; }
  #time.warn { animation: beat 1s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } }
  #pct, #alive { display: none; }
  body[data-mode="solo"] #pct, body[data-mode="battle"] #alive { display: inline-block; }
  body[data-mode="solo"] #board { display: none; }
  #board .crown { display: inline-block; width: 19px; margin-right: 4px; vertical-align: -3px; }
  #board .out { opacity: .45; text-decoration: line-through; }
  /* Kill-Meldungen oben in der Mitte */
  #feed { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 56px); left: 50%; transform: translateX(-50%); display: flex;
    flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .kf { background: #fff; border: 3px solid #1d2433; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 15px;
    box-shadow: 0 3px 0 #1d2433; white-space: nowrap; animation: kfin .25s ease-out; transition: opacity .4s; }
  .kf.me { background: #fff1b8; }
  .kf.bad { background: #ffd9d4; }
  .kf.out { opacity: 0; }
  @keyframes kfin { from { transform: translateY(-12px) scale(.8); opacity: 0; } }
  #combo { position: fixed; left: 50%; top: 29%; transform: translate(-50%, -50%); font-weight: 900; font-size: 36px; color: #ff7ac6;
    -webkit-text-stroke: 7px #1d2433; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #combo.on { opacity: 1; }
  #combo.bump { animation: bump .35s ease-out; }
  @keyframes bump { 40% { transform: translate(-50%, -50%) scale(1.4) rotate(-5deg); } }
  #crown { position: fixed; width: 34px; transform: translate(-50%, -100%); pointer-events: none; display: none; }
  #crown svg, .pcrown svg { display: block; width: 100%; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  #msg.pop2 { animation: msgpop .45s ease-out; }
  @keyframes msgpop { 0% { transform: translate(-50%, -50%) scale(.4); } 60% { transform: translate(-50%, -50%) scale(1.12); } }
  /* Siegerpodest */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 12px 0 4px; }
  .pod { width: 130px; font-weight: 900; }
  .pod i { display: block; width: 46px; height: 46px; margin: 0 auto 4px; border-radius: 50%; border: 3px solid #1d2433; position: relative; }
  .pod i::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #1d2433; }
  .pod b { display: block; font-size: 17px; }
  .pod.me b { color: #0f9c86; }
  .pod small { display: block; font-size: 13px; color: #6b7385; margin-bottom: 4px; }
  .step { border: 3px solid #1d2433; border-bottom: 0; border-radius: 14px 14px 0 0; font-size: 30px; color: #fff;
    -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; padding-top: 6px; }
  .p1 .step { height: 92px; background: #ffd23f; }
  .p2 .step { height: 66px; background: #cfd6e0; }
  .p3 .step { height: 46px; background: #f0a868; }
  .pcrown { width: 44px; margin: 0 auto 2px; }
  .big { font-size: 66px; font-weight: 900; color: #2fd3b9; -webkit-text-stroke: 9px #1d2433; paint-order: stroke fill; line-height: 1.1; margin-top: 8px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .go.alt { background: #fff; color: #1d2433; -webkit-text-stroke: 0; }
  .btns .go { padding-left: 30px; padding-right: 30px; }
  /* Ladeanzeige */
  #loading { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: linear-gradient(#4fb8ff, #d6f1ff); }
  .lhole { width: 96px; height: 96px; border-radius: 50%; background: #1d2433; border: 9px solid #2fd3b9; box-shadow: 0 0 0 4px #1d2433;
    animation: lh 1.1s ease-in-out infinite; }
  @keyframes lh { 50% { transform: scale(1.16); } }
  .ltitle { font-size: 64px; font-weight: 900; color: #2fd3b9; -webkit-text-stroke: 10px #1d2433; paint-order: stroke fill; line-height: 1.1; }
  #loadTxt { font-weight: 900; font-size: 19px; color: #fff; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; text-align: center; max-width: 90vw; }
  .card h1.h1s { font-size: 46px; -webkit-text-stroke: 8px #1d2433; }
  /* Loch-Symbol (Farbe oder Avatar) */
  .lk { display: inline-block; flex: none; position: relative; border-radius: 50%; border: 3px solid #1d2433; vertical-align: middle; }
  .lk::after { content: ''; position: absolute; inset: 17%; border-radius: 50%; background: #1d2433; }
  .lk em, .sk i em, .pod i em { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; font-style: normal; line-height: 1; }
  .sk i em { font-size: 25px; }
  .pod i em { font-size: 23px; }
  .go .lk { vertical-align: -5px; }
  /* Wer spielt? */
  .who { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 16px 0 6px; }
  .ptile { font: inherit; cursor: pointer; position: relative; width: 136px; background: #fff; border: 3px solid #1d2433; border-radius: 22px;
    padding: 14px 6px 10px; box-shadow: 0 5px 0 #1d2433; color: #1d2433; }
  .ptile:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d2433; }
  .ptile b { display: block; font-size: 20px; font-weight: 900; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptile small { display: block; font-size: 13px; font-weight: 800; color: #6b7385; }
  .ptile .del { position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; background: #ff5a4e; color: #fff;
    border: 3px solid #1d2433; font-weight: 900; font-size: 16px; line-height: 28px; }
  .ptile.add { border-style: dashed; box-shadow: none; background: #f6fffd; }
  .plus { display: flex; width: 66px; height: 66px; margin: 0 auto; border-radius: 50%; border: 3px dashed #1d2433; align-items: center;
    justify-content: center; font-size: 42px; font-weight: 900; color: #2fd3b9; }
  .link { font: inherit; background: none; border: 0; color: #6b7385; font-weight: 800; font-size: 15px; text-decoration: underline; cursor: pointer; margin-top: 10px; padding: 6px; }
  .name-in { -webkit-user-select: text; user-select: text; font: inherit; font-size: 28px; font-weight: 900; text-align: center; width: 100%; max-width: 320px;
    padding: 10px 16px; margin-top: 6px; border: 3px solid #1d2433; border-radius: 18px; outline: none; color: #1d2433; background: #fff; }
  .name-in:focus { box-shadow: 0 0 0 4px #2fd3b9; }
  /* Hauptmenü */
  .mebar { display: flex; align-items: center; gap: 12px; text-align: left; background: #f1fbf8; border: 3px solid #1d2433; border-radius: 18px;
    padding: 8px 10px 8px 12px; margin-top: 12px; }
  .mebar > span:not(.lk) { flex: 1; min-width: 0; }
  .mebar b { display: block; font-size: 22px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mebar small { display: block; font-size: 14px; font-weight: 800; color: #6b7385; }
  .segb.mini { flex: none; font-size: 15px; padding: 7px 12px; border-radius: 14px; box-shadow: 0 3px 0 #1d2433; }
  .worlds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
  .wcard { font: inherit; cursor: pointer; min-width: 0; background: #fff; border: 3px solid #1d2433; border-radius: 16px; padding: 6px 2px 5px;
    box-shadow: 0 4px 0 #1d2433; color: #1d2433; }
  .wcard:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d2433; }
  .wcard.on { background: #2fd3b9; }
  .wcard .wi { display: block; font-size: 30px; line-height: 1.2; }
  .wcard b { display: block; font-size: 12px; font-weight: 900; line-height: 1.15; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
  .wcard small { display: block; font-size: 12px; font-weight: 900; color: #e0a400; -webkit-text-stroke: .5px #1d2433; }
  /* Mein Loch */
  .avs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .prog { height: 16px; max-width: 340px; margin: 6px auto 0; background: #eef1f6; border: 3px solid #1d2433; border-radius: 99px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: #ffd23f; }
  .konto { font-weight: 900; color: #0f9c86; font-size: 16px !important; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs" } }</script>
<script>
  // Falls beim Laden etwas schiefgeht: Fehler in der Ladeanzeige zeigen statt ewig zu warten
  const lfFail = m => { const t = document.getElementById('loadTxt'); if (t) t.textContent = 'Fehler beim Laden: ' + m + ' · Seite neu laden'; };
  addEventListener('error', e => lfFail(e.message || 'Datei fehlt'));
  addEventListener('unhandledrejection', e => lfFail((e.reason && e.reason.message) || e.reason));
</script>
</head>
<body>
<div id="hud">
  <div id="top"><span class="pill" id="time">2:00</span><span class="pill" id="score">0</span><span class="pill" id="pct">0%</span><span class="pill" id="alive">4 übrig</span></div>
  <div id="sizeBox"><div id="tier"><span id="stage">Stufe 1</span><small id="holeName">Kanaldeckel</small></div>
    <div class="bar"><i id="bar"></i><span id="xpTxt">0 / 0 XP</span></div></div>
  <div id="bossBox"><div id="bossTxt">Endboss</div><div class="bar"><i id="bossBar"></i></div></div>
</div>
<div id="board"></div>
<div id="feed"></div>
<div id="combo"></div>
<div id="crown"></div>
<div id="msg"></div>
<div id="arrow"><i></i><b>ENDBOSS</b></div>
<div id="joy"><div id="knob"></div></div>
<div id="overlay"><div class="card" id="card"></div></div>
<button class="pill" id="snd" aria-label="Ton an oder aus"><svg viewBox="0 0 24 24" width="24" height="24">
  <path d="M3 9h4l5-4v14l-5-4H3z" fill="#1d2433" stroke="#1d2433" stroke-width="1.5" stroke-linejoin="round"/>
  <path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.3 5.8a9 9 0 0 1 0 12.4" stroke="#1d2433" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path class="x" d="M15.5 9l6 6M21.5 9l-6 6" stroke="#ff5a4e" stroke-width="2.8" stroke-linecap="round"/></svg></button>
<div id="loading"><div class="lhole"></div><div class="ltitle">Lochfrass!</div><div id="loadTxt">Lade …</div></div>
<script type="module" src="js/main.js" onerror="lfFail('Spieldatei fehlt')"></script>
</body>
</html>
