<!doctype html>
<html lang="de">
<head>

<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd6ff; touch-action: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #1d2433; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 18px 0; }
  .pill { display: inline-block; background: #fff; border: 3px solid #1d2433; border-radius: 999px; padding: 5px 16px;
    font-weight: 900; font-size: 22px; box-shadow: 0 4px 0 #1d2433; }
  #top { display: flex; gap: 10px; align-items: center; }
  #time.warn { background: #ff5a4e; color: #fff; }
  #sizeBox, #bossBox { margin-top: 12px; width: 230px; }
  #bossTxt { font-weight: 900; font-size: 14px; color: #ffd23f; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; }
  #bossBar { background: #ff5a4e !important; }
  #bossBox.ready #bossBar { background: #ffd23f !important; }
  #arrow { position: fixed; width: 0; height: 0; display: none; pointer-events: none; }
  #arrow i { position: absolute; left: -26px; top: -22px; width: 52px; height: 44px; background: #ffd23f;
    clip-path: polygon(0 20%, 55% 20%, 55% 0, 100% 50%, 55% 100%, 55% 80%, 0 80%); filter: drop-shadow(0 0 0 #1d2433); }
  #arrow b { position: absolute; left: -40px; top: 24px; width: 80px; text-align: center; font-size: 13px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; }
  #tier { font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; display: flex; justify-content: space-between; }
  #tier small { font-size: 13px; color: #ffd23f; }
  #sizeBox .bar { height: 18px; position: relative; }
  #xpTxt { position: absolute; inset: 0; text-align: center; font-size: 11px; font-weight: 900; line-height: 13px; color: #fff;
    -webkit-text-stroke: 3px #1d2433; paint-order: stroke fill; }
  #next { font-weight: 800; font-size: 13px; color: #fff; -webkit-text-stroke: 3px #1d2433; paint-order: stroke fill; margin-top: 3px; }
  #sizeBox.up .bar { animation: lvlup .6s ease-out; }
  @keyframes lvlup { 30% { transform: scale(1.12); box-shadow: 0 0 0 6px #ffd23f; } }
  .bar { height: 14px; background: #fff; border: 3px solid #1d2433; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; background: #2fd3b9; transition: width .2s; }
  #board { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 18px; background: #fff; border: 3px solid #1d2433;
    border-radius: 16px; padding: 8px 14px; min-width: 190px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #1d2433; }
  #board div { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  #board .me { color: #0f9c86; }
  #board .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; border: 2px solid #1d2433; vertical-align: -1px; }
  .tag { position: fixed; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; color: #fff;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; white-space: nowrap; pointer-events: none; }
  .pop { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 26px; color: #fff;
    -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; pointer-events: none; animation: up .8s ease-out forwards; }
  @keyframes up { 0% { transform: translate(-50%, -50%) scale(.6); } 25% { transform: translate(-50%, -80%) scale(1.15); } 100% { transform: translate(-50%, -170%) scale(1); opacity: 0; } }
  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 900;
    color: #ffd23f; -webkit-text-stroke: 8px #1d2433; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #joy { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.85); background: rgba(255,255,255,.18); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: #fff; border: 3px solid #1d2433; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(20,40,70,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { background: #fff; border: 4px solid #1d2433; border-radius: 30px; padding: 26px 34px; text-align: center; width: 560px; max-width: 100%;
    box-shadow: 0 10px 0 #1d2433; max-height: 100%; overflow: auto; }
  .card h1 { margin: 0; font-size: 60px; letter-spacing: -1px; color: #2fd3b9; -webkit-text-stroke: 9px #1d2433; paint-order: stroke fill; line-height: 1.1; }
  .card p { font-size: 18px; line-height: 1.4; margin: 8px 0; }
  .card .small { font-size: 14px; color: #6b7385; }
  .lvl { font-weight: 900; font-size: 20px !important; }
  .sec { font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #6b7385; margin: 18px 0 8px;
    display: flex; justify-content: space-between; }
  .tot { color: #e0a400; }
  .seg { display: flex; gap: 8px; }
  .segb, .sk, .go { font: inherit; cursor: pointer; border: 3px solid #1d2433; }
  .segb { flex: 1; background: #fff; border-radius: 16px; padding: 8px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 #1d2433; color: #1d2433; }
  .segb small { display: block; color: #ffc21a; font-size: 18px; letter-spacing: 2px; -webkit-text-stroke: 1px #1d2433; }
  .segb.on { background: #2fd3b9; }
  .skins { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .sk { background: none; border: 0; padding: 4px 0; border-radius: 14px; color: #1d2433; }
  .sk i { display: block; width: 50px; height: 50px; margin: 0 auto; border-radius: 50%; position: relative; border: 3px solid #1d2433; }
  .sk i::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #1d2433; }
  .sk small { display: block; font-size: 11px; font-weight: 800; margin-top: 4px; }
  .sk.on { background: #d9f7f1; outline: 3px solid #2fd3b9; }
  .sk.lock { opacity: .4; cursor: default; }
  .sk.lock i { filter: grayscale(1); }
  .go { background: #2fd3b9; color: #fff; font-weight: 900; font-size: 26px; border-radius: 999px; padding: 12px 46px; margin-top: 18px;
    box-shadow: 0 6px 0 #1d2433; -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; }
  .go:active, .segb:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d2433; }
  .stars { font-size: 54px; letter-spacing: 6px; color: #ffc21a; -webkit-text-stroke: 3px #1d2433; margin: 4px 0; }
  .stars .off { color: #e3e6ee; }
  #ranks { text-align: left; margin: 10px auto; font-weight: 800; font-size: 17px; max-width: 260px; }
  #ranks div { display: flex; justify-content: space-between; padding: 2px 0; }
  .unlock { background: #fff6d6; border: 3px dashed #e0a400; border-radius: 14px; padding: 8px; font-weight: 900; margin: 10px 0; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="hud">
  <div id="top"><span class="pill" id="time">2:30</span><span class="pill" id="score">0</span></div>
  <div id="sizeBox"><div id="tier"><span id="stage">Stufe 1</span><small id="holeName">Kanaldeckel</small></div>
    <div class="bar"><i id="bar"></i><span id="xpTxt">0 / 0 XP</span></div><div id="next">Als Nächstes: Laternen & Bänke</div></div>
  <div id="bossBox"><div id="bossTxt">Endboss: Riesenturm</div><div class="bar"><i id="bossBar"></i></div></div>
</div>
<div id="board"></div>
<div id="msg"></div>
<div id="arrow"><i></i><b>ENDBOSS</b></div>
<div id="joy"><div id="knob"></div></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

// ================= Einstellungen =================
const MAP = 120;                               // Karte geht von -120 bis +120
const ROADS = [-90, -60, -30, 0, 30, 60, 90];
const BLOCKS = [-105, -75, -45, -15, 15, 45, 75, 105];
const ROUND_TIME = 600;                        // 10 Minuten
const R0 = 0.6;                                // Startgröße des Lochs
const LEVEL = 1;
const INK = '#1d2433';                          // Konturfarbe

// Schwierigkeit: s0/s1 = Tempo der Gegner am Anfang/Ende der Anlaufzeit (ramp, Sekunden)
const DIFFS = {
  leicht: { label: 'Leicht', bots: 3, s0: 0.35, s1: 0.65, ramp: 420, huntPlayer: false, huntDelay: 9999, smart: 0.5,
    stars: [0.1, 0.2, 0.35], desc: 'Gegner bleiben gemütlich und jagen dich nie.' },
  normal: { label: 'Normal', bots: 3, s0: 0.45, s1: 0.85, ramp: 300, huntPlayer: true, huntDelay: 180, smart: 0.8,
    stars: [0.15, 0.3, 0.5], desc: 'Gegner starten langsam, werden nach und nach flotter und jagen dich ab Minute 3.' },
  schwer: { label: 'Schwer', bots: 4, s0: 0.6, s1: 1.0, ramp: 150, huntPlayer: true, huntDelay: 60, smart: 1,
    stars: [0.2, 0.4, 0.6], desc: '4 Gegner, schnell auf Tempo, jagen dich schon ab Minute 1.' },
};
const SKINS = [
  { id: 'minze', name: 'Minze', stars: 0, cols: ['#2fd3b9'] },
  { id: 'koralle', name: 'Koralle', stars: 1, cols: ['#ff5a4e'] },
  { id: 'gold', name: 'Gold', stars: 2, cols: ['#ffd23f', '#ff9f1c'], spin: 0.6 },
  { id: 'bonbon', name: 'Bonbon', stars: 3, cols: ['#ff7ac6', '#9b6bff'], spin: 0.8 },
  { id: 'regenbogen', name: 'Regenbogen', stars: 5, rainbow: true, spin: 1 },
  { id: 'lava', name: 'Lava', stars: 7, cols: ['#ff3d00', '#ffb300', '#ff3d00', '#ffe066'], spin: 1.6, pulse: true },
  { id: 'galaxie', name: 'Galaxie', stars: 9, cols: ['#6a5cff', '#00e5ff', '#ff4fd8'], spin: 1.2, pulse: true },
];
const BOTS = [['Mampf', '#ff8a3d'], ['Schlürf', '#ffd23f'], ['Krümel', '#9b6bff'], ['Happs', '#4f8bff']];
const TIERS = [[0.6, 'Kanaldeckel'], [1.2, 'Gully'], [2.2, 'Krater'], [4.5, 'Schlund'], [8, 'Abgrund'], [11, 'Schwarzes Loch'], [999, '']];
// Stufen: ab welchem Loch-Radius welche Objekte reinpassen (Radius = Schluckgröße / 0,95)
const STAGES = [[0.6, 'Kleinkram & Menschen'], [0.7, 'Laternen & Bänke'], [0.95, 'Büsche'], [1.5, 'Autos'], [1.75, 'Bäume'],
  [2.35, 'Brunnen & Gartenhäuser'], [4.95, 'Häuser'], [8.5, 'Wohnblöcke'], [10.55, 'Endboss']];
let GROWTH = 0.06;
let GROWTH_EXP = 0.58;
const radiusFor = m => R0 + GROWTH * Math.pow(m, GROWTH_EXP);
const massFor = r => r <= R0 ? 0 : Math.pow((r - R0) / GROWTH, 1 / GROWTH_EXP);   // Umkehrung: welche Masse für Radius r
let shownStage = -1;

// ================= Speicher (nur lokal auf dem Gerät) =================
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('lochfrass-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('lochfrass-' + k, JSON.stringify(v)); } catch {} },
};
const starsFor = d => LS.get(`stars-${LEVEL}-${d}`, 0);
const totalStars = () => Object.keys(DIFFS).reduce((s, d) => s + starsFor(d), 0);
let diffKey = LS.get('diff', 'normal');
let skinId = LS.get('skin', 'minze');
if (!SKINS.some(s => s.id === skinId && s.stars <= totalStars())) skinId = 'minze';

// ================= Zufall (fester Startwert = immer gleiche Karte) =================
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ================= Renderer, Comic-Look =================
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
// Konturlinien um alle Objekte
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0075, defaultColor: [0.11, 0.14, 0.2] });
const NO_OUTLINE = { outlineParameters: { visible: false } };

const scene = new THREE.Scene();
function canvasTex(size, draw, h = size) {
  const c = document.createElement('canvas'); c.width = size; c.height = h; const x = c.getContext('2d'); draw(x, size, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
scene.background = canvasTex(4, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#4fb8ff'); g.addColorStop(1, '#d6f1ff'); x.fillStyle = g; x.fillRect(0, 0, w, h); }, 256);
scene.fog = new THREE.Fog(0xd6f1ff, 100, 300);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 500);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb5d99a, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// Cel-Shading: Licht in 3 harten Stufen statt weichem Verlauf
const gradMap = (() => { const t = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (o = {}) => new THREE.MeshToonMaterial({ gradientMap: gradMap, ...o });
const vcMat = toon({ vertexColors: true });

// ================= Boden-Texturen =================
function speckle(x, w, col, alpha, n, size = 3) {
  for (let i = 0; i < n; i++) { x.fillStyle = `rgba(${col},${Math.random() * alpha})`; const r = Math.random() * size + 1; x.fillRect(Math.random() * w, Math.random() * w, r, r); }
}
const TEX = {
  grass: canvasTex(256, (x, s) => { x.fillStyle = '#7ed957'; x.fillRect(0, 0, s, s);
    x.strokeStyle = '#5fb83f'; x.lineWidth = 3; x.lineCap = 'round';
    for (let i = 0; i < 40; i++) { const a = Math.random() * s, b = Math.random() * s; x.beginPath(); x.moveTo(a - 4, b - 6); x.lineTo(a, b); x.lineTo(a + 4, b - 6); x.stroke(); } }),
  asphalt: canvasTex(256, (x, s) => { x.fillStyle = '#4e5566'; x.fillRect(0, 0, s, s); speckle(x, s, '30,34,44', .4, 300); speckle(x, s, '120,128,145', .3, 200); }),
  walk: canvasTex(128, (x, s) => { x.fillStyle = '#f2e9d6'; x.fillRect(0, 0, s, s); x.strokeStyle = '#d6c9ae'; x.lineWidth = 4;
    x.strokeRect(0, 0, 64, 64); x.strokeRect(64, 0, 64, 64); x.strokeRect(0, 64, 64, 64); x.strokeRect(64, 64, 64, 64); }),
  plaza: canvasTex(128, (x, s) => { x.fillStyle = '#f6dfb4'; x.fillRect(0, 0, s, s); x.strokeStyle = '#ddbf8a'; x.lineWidth = 3;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) x.strokeRect(c * 32 + (r % 2) * 16, r * 32, 32, 32); }),
  water: canvasTex(128, (x, s) => { x.fillStyle = '#5cc8f5'; x.fillRect(0, 0, s, s); x.strokeStyle = '#a9e6ff'; x.lineWidth = 4; x.lineCap = 'round';
    for (let i = 0; i < 6; i++) { const a = Math.random() * s, b = Math.random() * s; x.beginPath(); x.arc(a, b, 10, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); } }),
};
// Boden-Material: wird dort NICHT gezeichnet, wo ein Loch ist (Stencil-Trick)
function groundMat(tex, rx = 1, rz = 1, color = 0xffffff) {
  let map = null; if (tex) { map = tex.clone(); map.needsUpdate = true; map.repeat.set(rx, rz); }
  const m = toon({ map, color, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc,
    stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp });
  m.userData = NO_OUTLINE; return m;
}
function flat(w, d, x, z, y, tex, scale) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), groundMat(tex, w / scale, d / scale));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}

// ================= Bausteine für Objekte =================
const NI = g => g.index ? g.toNonIndexed() : g;
function prismGeo() { const s = new THREE.Shape(); s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 1); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5); }
const GE = {
  sph: NI(new THREE.SphereGeometry(1, 12, 9)),
  cyl: NI(new THREE.CylinderGeometry(1, 1, 1, 16)),
  cylLo: NI(new THREE.CylinderGeometry(1, 1, 1, 8)),
  cone: NI(new THREE.ConeGeometry(1, 1, 12)),
  rbox: NI(new RoundedBoxGeometry(1, 1, 1, 2, 0.16)),
  legs: NI(new THREE.CapsuleGeometry(0.15, 0.3, 3, 8)),
  torso: NI(new THREE.CapsuleGeometry(0.23, 0.32, 3, 10)),
  carBody: NI(new RoundedBoxGeometry(3.4, 0.8, 1.7, 3, 0.32)),
  carCab: NI(new RoundedBoxGeometry(1.9, 0.78, 1.5, 3, 0.3)),
  prism: NI(prismGeo()),
};
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
// Ein Teil = Grundform + Farbe + Position/Größe/Drehung. Alle Teile eines Objekts werden zu EINEM Mesh verschmolzen (schneller).
function P(geo, hex, x = 0, y = 0, z = 0, sx = 1, sy = sx, sz = sx, rx = 0, ry = 0, rz = 0) {
  const g = geo.clone();
  g.applyMatrix4(_m.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz)));
  const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
function build(parts, material = vcMat) { const m = new THREE.Mesh(mergeGeometries(parts), material); m.castShadow = m.receiveShadow = true; return m; }
const shade = (hex, f) => '#' + new THREE.Color(hex).multiplyScalar(f).getHexString();

const C = {
  skin: ['#ffd7b0', '#e8a878', '#a86f48', '#ffe6cc'], hair: ['#3b2a20', '#7a4a2a', '#f2c94c', '#1d1d24', '#c0553a'],
  shirt: ['#ff5a4e', '#4f8bff', '#ffd23f', '#9b6bff', '#2fd3b9', '#ff7ac6', '#ff8a3d'], pants: ['#3c4a6b', '#2d3240', '#6b5a48'],
  leaf: ['#5ccf3f', '#45b83a', '#8ee05a'], car: ['#ff5a4e', '#4f8bff', '#ffd23f', '#ffffff', '#2fd3b9', '#9b6bff', '#ff8a3d'],
  roof: ['#ff6b4a', '#c8553d', '#5b6fd8', '#ff9f1c', '#3fae6b'], bin: ['#3fae6b', '#6d7686', '#4f8bff'],
};

// ================= Objekte =================
const objects = [], houseRects = [];
function add(obj, x, z, r, v, h, extra = {}) {
  obj.position.set(x, 0, z); scene.add(obj);
  // L/W = halbe Länge/Breite der Grundfläche, s = „Schluckgröße“ (wie groß das Loch mindestens sein muss)
  const o = { g: obj, r, v, h, falling: false, state: null, L: r * 0.9, W: r * 0.9, ...extra };
  o.s = extra.s || Math.max(o.W, o.L * 0.7) * 1.1;
  objects.push(o); return o;
}
function person(x, z) {
  const m = build([P(GE.legs, pick(C.pants), 0, 0.3, 0), P(GE.torso, pick(C.shirt), 0, 0.8, 0),

// Häuser: Wände mit Fenster-Textur + verschmolzene Extras (Dach, Tür, Kamin …)
function windowTex(wall) {
  return canvasTex(128, (x, s) => {
    x.fillStyle = wall; x.fillRect(0, 0, s, s);
    x.fillStyle = shade(wall, 0.92); x.fillRect(0, 118, s, 10);
    x.fillStyle = '#ffffff'; x.fillRect(30, 22, 68, 74);
    const g = x.createLinearGradient(0, 28, 0, 90); g.addColorStop(0, '#6fc3f0'); g.addColorStop(1, '#c9ecff'); x.fillStyle = g; x.fillRect(37, 29, 54, 60);
    x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); x.moveTo(42, 82); x.lineTo(60, 32); x.lineTo(70, 32); x.lineTo(52, 82); x.fill();
    x.fillStyle = '#ffffff'; x.fillRect(62, 29, 4, 60); x.fillRect(37, 57, 54, 4);
    x.strokeStyle = INK; x.lineWidth = 4; x.strokeRect(30, 22, 68, 74);
    x.fillStyle = '#fff'; x.fillRect(24, 96, 80, 8); x.strokeRect(24, 96, 80, 8);
  });
}
const WALLS = ['#fff1d6', '#ffd6c9', '#d4ecff', '#fff09a', '#e6dcff', '#ffffff', '#d2f5dd', '#ffc9a3'].map(windowTex);
function house(x, z, w, d, h, opts = {}) {
  const tex = pick(WALLS).clone(); tex.needsUpdate = true;
  tex.repeat.set(Math.max(1, Math.round(w / 2.8)), Math.max(1, Math.round(h / 3)));
  const wallMat = toon({ map: tex });
  const walls = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.25).translate(0, h / 2, 0), wallMat);
  walls.castShadow = walls.receiveShadow = true;
  const pitched = opts.flat ? false : (opts.pitched || (rnd() < 0.6 && h < 11));
  const rc = pick(C.roof);
  const parts = [P(GE.rbox, '#a39a8c', 0, 0.3, 0, w + 0.2, 0.6, d + 0.2),
    P(GE.rbox, '#8a5634', 0, 1.0, d / 2 + 0.04, 1.1, 2.0, 0.14), P(GE.sph, '#ffd23f', 0.35, 1.0, d / 2 + 0.13, 0.07),
    P(GE.rbox, rc, 0, 2.15, d / 2 + 0.35, 1.7, 0.12, 0.75)];
  let top = h;
  if (pitched) {
    const rh = Math.min(w, d) * R(0.35, 0.5);
    parts.push(P(GE.prism, rc, 0, h - 0.05, 0, w + 0.6, rh, d + 0.6));
    if (rnd() < 0.6) parts.push(P(GE.rbox, '#b5674d', w * 0.25, h + rh * 0.5, d * 0.12, 0.55, rh * 0.95, 0.55));
    top += rh;
  } else {
    parts.push(P(GE.rbox, '#b9c0cc', 0, h + 0.15, 0, w + 0.15, 0.35, d + 0.15));
    parts.push(P(GE.rbox, '#e3e7ee', w * 0.2, h + 0.7, -d * 0.15, 1.3, 0.8, 1.0));
    if (h > 12 && rnd() < 0.6) { parts.push(P(GE.cyl, '#c98a52', -w * 0.22, h + 1.6, d * 0.15, 0.8, 1.6, 0.8), P(GE.cone, '#8a5634', -w * 0.22, h + 2.8, d * 0.15, 0.95, 0.8, 0.95)); top += 3.2; }
    else top += 1.1;
  }
  const extraMat = vcMat.clone();
  const g = new THREE.Group(); g.add(walls, build(parts, extraMat));
  houseRects.push([x - w / 2 - 0.6, x + w / 2 + 0.6, z - d / 2 - 0.6, z + d / 2 + 1.2]);
  return add(g, x, z, Math.hypot(w, d) / 2 * 0.85, Math.round(w * d * top / 10), top,
    { mats: [wallMat, extraMat], fade: 1, L: Math.max(w, d) / 2 + 0.3, W: Math.min(w, d) / 2 + 0.3, longZ: d > w });
}

// Endboss: riesiges Hochhaus, nur der Spieler kann es schlucken
const GLASS = canvasTex(128, (x, s) => {
  const g = x.createLinearGradient(0, 0, s, s); g.addColorStop(0, '#5fb4f0'); g.addColorStop(1, '#9ad8ff'); x.fillStyle = g; x.fillRect(0, 0, s, s);
  x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.moveTo(10, 128); x.lineTo(60, 0); x.lineTo(80, 0); x.lineTo(30, 128); x.fill();
  x.fillStyle = '#eef3f8'; x.fillRect(0, 0, s, 10); x.fillRect(0, 0, 8, s); x.fillRect(64, 0, 5, s);
  x.strokeStyle = INK; x.lineWidth = 3; x.strokeRect(0, 0, s, s);
});
let BOSS = null;
function boss(x, z) {
  const g = new THREE.Group(), mats = [], parts = [];
  parts.push(P(GE.rbox, '#cfd6e0', 0, 1.5, 0, 15, 3, 15), P(GE.rbox, '#3a4152', 0, 1.4, 7.55, 4, 2.6, 0.3),
    P(GE.rbox, '#ff5a4e', 0, 3.1, 8.3, 5.5, 0.25, 1.6));
  let y = 3;
  for (const [s, hh] of [[13, 22], [10.5, 18], [8, 14]]) {
    const t = GLASS.clone(); t.needsUpdate = true; t.repeat.set(Math.round(s / 2), Math.round(hh / 2.5));
    const m = toon({ map: t }); mats.push(m);
    const mesh = new THREE.Mesh(new RoundedBoxGeometry(s, hh, s, 2, 0.4).translate(0, y + hh / 2, 0), m);
    mesh.castShadow = mesh.receiveShadow = true; g.add(mesh);
    y += hh; parts.push(P(GE.rbox, '#e9eef5', 0, y, 0, s + 0.8, 0.7, s + 0.8));
  }
  parts.push(P(GE.cone, '#ffd23f', 0, y + 3, 0, 4.5, 6, 4.5), P(GE.cylLo, '#3a4152', 0, y + 8.5, 0, 0.25, 6, 0.25),
    P(GE.sph, '#ff4136', 0, y + 11.6, 0, 0.7));
  const em = vcMat.clone(); mats.push(em); g.add(build(parts, em));
  houseRects.push([x - 8, x + 8, z - 8, z + 9]);
  BOSS = add(g, x, z, 10.6, 1500, y + 12.3, { mats, fade: 1, boss: true, L: 7.5, W: 7.5, s: 10 });
  return BOSS;
}

// ================= Welt aufbauen: Level 1 „Vorstadt“ =================
const W = 2 * MAP + 10;
flat(600, 600, 0, 0, 0, TEX.grass, 9);
for (const rc of ROADS) { flat(W, 10, 0, rc, 0.01, TEX.walk, 2.5); flat(10, W, rc, 0, 0.011, TEX.walk, 2.5); }
for (const rc of ROADS) { flat(W, 7, 0, rc, 0.02, TEX.asphalt, 8); flat(7, W, rc, 0, 0.021, TEX.asphalt, 8); }
{ // Fahrbahnmarkierungen, Zebrastreifen, Bordsteine
  const mark = [], curb = [];
  const pg = (w, d, x, z) => new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2).translate(x, 0.03, z);
  for (const rc of ROADS) {
    for (let t = -MAP; t < MAP; t += 4) {
      if (ROADS.some(r => Math.abs(t - r) < 9)) continue;
      mark.push(pg(1.8, 0.22, t, rc), pg(0.22, 1.8, rc, t));
    }
    for (const r of ROADS) for (const s of [-1, 1]) for (let i = 0; i < 6; i++) {
      const off = -2.75 + i * 1.1;
      mark.push(pg(2.0, 0.55, r + s * 6.3, rc + off), pg(0.55, 2.0, rc + off, r + s * 6.3));
    }
    let prev = -MAP - 5;
    for (const r of [...ROADS, MAP + 5 + 4.6]) {
      const a = prev, b = r - 4.6, len = b - a, mid = (a + b) / 2;
      if (len > 0) for (const s of [-1, 1]) {
        curb.push(new THREE.BoxGeometry(len, 0.16, 0.35).translate(mid, 0.08, rc + s * 3.6));
        curb.push(new THREE.BoxGeometry(0.35, 0.16, len).translate(rc + s * 3.6, 0.08, mid));
      }
      prev = r + 4.6;
    }
  }
  const mm = new THREE.Mesh(mergeGeometries(mark), groundMat(null, 1, 1, 0xffffff)); mm.receiveShadow = true; scene.add(mm);
  const cm = new THREE.Mesh(mergeGeometries(curb), groundMat(null, 1, 1, 0xd8cdb6)); cm.receiveShadow = true; scene.add(cm);
}
{ // Hecke aus Kugeln als Kartenrand (nur Deko)
  const parts = [];
  for (let t = -MAP - 4; t <= MAP + 4; t += 2.6) for (const s of [-1, 1]) {
    const g = rnd() < 0.5 ? '#4fb83a' : '#5ccf3f', k = R(1.3, 1.7);
    parts.push(P(GE.sph, g, t, k * 0.8, s * (MAP + 3.5), k), P(GE.sph, g, s * (MAP + 3.5), k * 0.8, t, k));
  }
  const hm = build(parts); hm.castShadow = false; scene.add(hm);
}

const onRoad = (x, z, pad = 5.2) => ROADS.some(r => Math.abs(x - r) < pad || Math.abs(z - r) < pad);
const inHouse = (x, z) => houseRects.some(([a, b, c, d]) => x > a && x < b && z > c && z < d);
const freeSpot = (bx, bz, spread = 9.5) => { for (let i = 0; i < 12; i++) { const x = bx + R(-spread, spread), z = bz + R(-spread, spread); if (!inHouse(x, z)) return [x, z]; } return null; };
const PLAZAS = ['15,-15', '-45,45', '75,-45', '-75,-75', '105,75', '-105,15'];
for (const bx of BLOCKS) for (const bz of BLOCKS) {
  const cd = Math.max(Math.abs(bx), Math.abs(bz));
  const r0 = rnd();
  if (bx === -15 && bz === -15) {   // Endboss-Block
    boss(bx, bz);
    for (const [ox, oz] of [[-10, -10], [10, -10], [-10, 10], [10, 10]]) tree(bx + ox, bz + oz);
    continue;
  }
  const kind = PLAZAS.includes(bx + ',' + bz) ? 'plaza' : r0 < 0.2 ? 'park' : r0 < 0.28 ? 'parking' : (cd <= 15 && r0 < 0.75) || (cd <= 45 && r0 < 0.42) ? 'tower' : 'houses';
  if (kind === 'houses') {
    for (const ox of [-5, 5]) for (const oz of [-5, 5]) {
      if (rnd() < 0.12) { house(bx + ox, bz + oz, R(2.4, 3), R(2.2, 2.8), R(2, 2.6), { pitched: true }); continue; }   // Gartenhaus
      house(bx + ox, bz + oz, R(5.5, 8.5), R(5.5, 8), R(4, 9) + (cd < 50 ? R(0, 3) : 0));
    }
    for (let i = 0; i < 5; i++) { const p = freeSpot(bx, bz); if (p) bush(...p); }
    for (let i = 0; i < 2; i++) { const p = freeSpot(bx, bz); if (p) (rnd() < 0.3 ? pine : tree)(...p); }
  } else if (kind === 'tower') {
    house(bx, bz - 1, R(12, 16), R(11, 14), R(13, 22) + (cd <= 15 ? 6 : 0), { flat: true });
    for (const [ox, oz] of [[-9, 9], [9, 9]]) tree(bx + ox, bz + oz);
    bench(bx - 4, bz + 9, Math.PI); bin(bx + 3, bz + 9.5);
  } else if (kind === 'park') {
    flat(9, 6, bx + R(-3, 3), bz + R(-3, 3), 0.012, TEX.water, 6);
    for (let i = 0; i < 12; i++) (rnd() < 0.35 ? pine : tree)(bx + R(-10, 10), bz + R(-10, 10));
    for (let i = 0; i < 7; i++) bush(bx + R(-10, 10), bz + R(-10, 10));
    for (let i = 0; i < 4; i++) bench(bx + R(-8, 8), bz + R(-8, 8), R(0, 6));
    for (let i = 0; i < 2; i++) bin(bx + R(-9, 9), bz + R(-9, 9));
  } else if (kind === 'parking') {
    flat(22, 22, bx, bz, 0.012, TEX.asphalt, 8);
    for (const oz of [-5, 5]) for (let i = 0; i < 5; i++) if (rnd() < 0.8) car(bx - 8 + i * 4, bz + oz, Math.PI / 2 * (oz > 0 ? 1 : -1));
    lamp(bx - 10, bz); lamp(bx + 10, bz);
  } else {
    flat(22, 22, bx, bz, 0.012, TEX.plaza, 4);
    fountain(bx, bz);
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.4; bench(bx + Math.cos(a) * 5.5, bz + Math.sin(a) * 5.5, -a - Math.PI / 2); }
    for (const [lx, lz] of [[-8, -8], [8, -8], [-8, 8], [8, 8]]) lamp(bx + lx, bz + lz);
    for (let i = 0; i < 4; i++) bin(bx + R(-9, 9), bz + R(-9, 9));
    for (let i = 0; i < 4; i++) bush(bx + R(-10, 10), bz + R(-10, 10));
    house(bx + 7, bz - 7.5, 3.5, 3, 3, { pitched: true });   // Kiosk
  }
}
for (const rc of ROADS) {   // Gehweg-Ausstattung + parkende Autos
  let step = 0;
  for (let t = -MAP + 3; t < MAP - 2; t += 10, step++) {
    if (ROADS.some(r => Math.abs(t - r) < 7)) continue;
    const s = step % 2 ? 1 : -1;
    lamp(t, rc + s * 4.4); lamp(rc + s * 4.4, t);
    if (rnd() < 0.35) bin(t + 2, rc - s * 4.4);
    if (rnd() < 0.35) bin(rc - s * 4.4, t + 2);
    if (rnd() < 0.15) hydrant(t - 2, rc + s * 4.5);
    if (rnd() < 0.3) small(t + 4, rc + s * 4.2); if (rnd() < 0.3) small(rc - s * 4.2, t - 4);
  }
  for (let t = -MAP + 6; t < MAP - 4; t += R(8, 13)) {
    if (ROADS.some(r => Math.abs(t - r) < 9)) continue;
    if (rnd() < 0.45) car(t, rc + pick([-1, 1]) * 2.4, 0);
    if (rnd() < 0.45) car(rc + pick([-1, 1]) * 2.4, t, Math.PI / 2);
  }
}
for (let i = 0; i < 22; i++) {   // fahrende Autos
  const rc = pick(ROADS), dir = pick([-1, 1]), t = R(-MAP, MAP), lane = rc + dir * 0.9;
  if (rnd() < 0.5) car(t, lane, dir > 0 ? 0 : Math.PI, { ax: 'x', v: dir * R(4, 6) });
  else car(lane, t, dir > 0 ? -Math.PI / 2 : Math.PI / 2, { ax: 'z', v: dir * R(4, 6) });
}
for (let n = 0; n < 480;) {   // Menschen

    if (o.theta >= jamA) {                                // verkantet!
      o.theta = jamA; o.thv = 0;
      if (!o.jam && h.isPlayer && !jamHintShown) { jamHintShown = true; flash('Verkantet! Hin und her wackeln'); }
      o.jam = true;
      o.shake += h.speed * dt;
      o.wob = h.speed > 1 ? (Math.random() - 0.5) * 0.09 : 0;
      if (o.shake > 1.5 + Leff * 0.8) { o.slip = true; o.jam = false; }
    } else {
      o.jam = false; o.wob = 0;
      const k = Math.min(1, dt * (0.6 + o.theta)) * 0.5;  // rutscht Richtung Mitte
      b.x += (o.cx - b.x) * k; b.z += (o.cz - b.z) * k;
    }
    if (o.theta > 1.2) { applyTip(o); o.vy = -3; startFall(o, h); return; }
  }
  applyTip(o);
}
// dreht das Objekt um den Punkt an der Lochkante
function applyTip(o) {
  const [ux, uz] = o.dir;
  _pv.set(o.cx + ux * o.R, 0, o.cz + uz * o.R);
  _ax.set(-uz, 0, ux);
  _qt.setFromAxisAngle(_ax, o.theta + o.wob);
  o.g.quaternion.copy(_qt).multiply(o.yawQ);
  o.g.position.copy(_tv.copy(o.base).sub(_pv).applyQuaternion(_qt).add(_pv));
}

function updateVisuals(dt, now) {
  for (const h of holes) {
    h.grp.position.set(h.x, 0, h.z); h.grp.scale.set(h.rShow, 1, h.rShow);
    if (h.skin.spin) { h.rim.rotation.z += dt * h.skin.spin; h.glow.rotation.z = h.rim.rotation.z; }
    h.glow.material.opacity = h.skin.pulse ? 0.55 + 0.45 * Math.sin(now / 180) : 1;
  }
  const zoom = 0.85 + player.rShow * 0.3;
  camera.position.lerp(new THREE.Vector3(player.x, 14 * zoom, player.z + 7 * zoom), Math.min(1, dt * 3));
  camLook.lerp(new THREE.Vector3(player.x, 0, player.z - 0.5), Math.min(1, dt * 5));
  camera.lookAt(camLook);
  if (shakeT > 0) { shakeT -= dt; const a = Math.min(1, shakeT) * 0.6;
    camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; }
  // Pfeil zum Endboss, sobald du groß genug bist und er nicht im Bild ist
  const arrow = $('arrow');
  if (running && !bossEaten && player.rShow >= BOSS.s / 0.95) {
    const bp = new THREE.Vector3(BOSS.g.position.x, 0, BOSS.g.position.z).project(camera);
    const cx = innerWidth / 2, cy = innerHeight / 2;
    let vx = (bp.x + 1) / 2 * innerWidth - cx, vy = (1 - bp.y) / 2 * innerHeight - cy;
    if (bp.z > 1) { vx = -vx; vy = -vy; }
    const onScreen = bp.z < 1 && Math.abs(vx) < cx - 60 && Math.abs(vy) < cy - 60;
    if (onScreen) arrow.style.display = 'none';
    else { const k = Math.min((cx - 60) / Math.abs(vx || 1), (cy - 70) / Math.abs(vy || 1));
      arrow.style.display = 'block'; arrow.style.left = cx + vx * k + 'px'; arrow.style.top = cy + vy * k + 'px';
      arrow.firstElementChild.style.transform = `rotate(${Math.atan2(vy, vx)}rad)`; }
  } else arrow.style.display = 'none';
  // Schatten-Bereich folgt dem Spieler (schärfere Schatten als über die ganze Karte)
  const ext = Math.round(28 + player.rShow * 4);
  const sc = sun.shadow.camera;
  if (sc.right !== ext) { sc.left = sc.bottom = -ext; sc.right = sc.top = ext; sc.updateProjectionMatrix(); }
  sun.position.set(player.x + 35, 70, player.z + 25); sun.target.position.set(player.x, 0, player.z);
  // Häuser zwischen Kamera und Loch durchsichtig machen
  const H = camera.position.y, Dz = Math.max(1, camera.position.z - player.z);
  for (const o of objects) {
    if (!o.mats) continue;
    const p = o.g.position, dz = p.z - player.z;
    const lineH = H * Math.max(0, dz - o.r) / Dz;
    const block = !o.falling && dz > -o.r && dz < Dz + o.r && o.h > lineH && Math.abs(p.x - player.x) < o.r + player.rShow + (o.boss ? 10 : 1.5);
    const target = block ? 0.3 : 1;
    if (Math.abs(o.fade - target) < 0.01) continue;
    o.fade += (target - o.fade) * Math.min(1, dt * 8);
    if (Math.abs(o.fade - target) < 0.01) o.fade = target;
    for (const m of o.mats) { m.transparent = o.fade < 1; m.opacity = o.fade; m.depthWrite = o.fade >= 1; m.userData = o.fade < 1 ? NO_OUTLINE : {}; }
  }
  for (const b of bots) {
    if (!b.alive) { b.tag.style.display = 'none'; continue; }
    const p = new THREE.Vector3(b.x, 0.5, b.z - b.rShow).project(camera);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    b.tag.style.display = vis ? 'block' : 'none';
    b.tag.style.left = (p.x + 1) / 2 * innerWidth + 'px'; b.tag.style.top = (1 - p.y) / 2 * innerHeight + 'px';
  }
}

function endRound() {
  running = false; drag.on = false; joy.style.display = 'none';
  const ranked = [...holes].sort((a, b) => b.score - a.score);
  const place = ranked.indexOf(player) + 1;
  const thr = starScores();
  const stars = thr.filter(s => player.score >= s).length;
  const before = totalStars();
  if (stars > starsFor(diffKey)) LS.set(`stars-${LEVEL}-${diffKey}`, stars);
  const best = Math.max(player.score, LS.get(`best-${LEVEL}-${diffKey}`, 0));
  LS.set(`best-${LEVEL}-${diffKey}`, best);
  const after = totalStars();
  const unlocked = SKINS.filter(s => s.stars > before && s.stars <= after);
  card.innerHTML = `
    <h1>Zeit um!</h1>
    <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
    <p><b>${player.score} Punkte</b> · Platz ${place} von ${holes.length} · ${D.label}<br>${Math.round(eaten / TOTAL * 100)}% der Vorstadt geschluckt${bossEaten ? ' · Endboss besiegt!' : ''}</p>
    ${unlocked.length ? `<div class="unlock">Neuer Skin: ${unlocked.map(s => s.name).join(', ')}!</div>` : ''}
    <div id="ranks">${ranked.map((h, i) => `<div><span>${i + 1}. ${h.name}</span><span>${h.score}</span></div>`).join('')}</div>
    <p class="small">Bestwert ${best} · Sterne ab ${thr.join(' / ')} Punkten</p>
    <button class="go" onclick="location.reload()">Nochmal</button>`;
  $('overlay').style.display = 'flex';
}

renderStart();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) update(dt);
  updateVisuals(dt, now);
  if ((hudT -= dt) <= 0) { updateHud(); hudT = 0.1; }
  effect.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// Test-Helfer: __lf.sim(150, true) spielt eine Runde im Schnelldurchlauf mit Autopilot
window.__lf = { player, holes, objects, TOTAL_VALUE, starScores, setGrowth: (g, e = GROWTH_EXP) => { GROWTH = g; GROWTH_EXP = e; },
  sim(sec, auto = false) { autopilot = auto; if (!running) startGame(); for (let t = 0; t < sec && running; t += 1 / 30) update(1 / 30); autopilot = false;
    return { score: player.score, r: player.r.toFixed(1), bots: bots.map(b => b.name + ':' + b.score), stars: starScores(), total: TOTAL_VALUE }; } };
</script>
</body>
