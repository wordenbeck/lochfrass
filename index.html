<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #1d2433; }

  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 18px 0; }

    font-weight: 900; font-size: 22px; box-shadow: 0 4px 0 #1d2433; }
  #top { display: flex; gap: 10px; align-items: center; }
  #time.warn { background: #ff5a4e; color: #fff; }

  #tier { font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; display: flex; justify-content: space-between; }
  #tier small { font-size: 13px; color: #ffd23f; }
  #sizeBox .bar { height: 18px; position: relative; }
  #xpTxt { position: absolute; inset: 0; text-align: center; font-size: 11px; font-weight: 900; line-height: 13px; color: #fff;
    -webkit-text-stroke: 3px #1d2433; paint-order: stroke fill; }
  #next { font-weight: 800; font-size: 13px; color: #fff; -webkit-text-stroke: 3px #1d2433; paint-order: stroke fill; margin-top: 3px; }

  @keyframes lvlup { 30% { transform: scale(1.12); box-shadow: 0 0 0 6px #ffd23f; } }
  .bar { height: 14px; background: #fff; border: 3px solid #1d2433; border-radius: 99px; overflow: hidden; margin-top: 4px; }

  #board { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 18px; background: #fff; border: 3px solid #1d2433;

  #board div { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  #board .me { color: #0f9c86; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; border: 2px solid #1d2433; vertical-align: -1px; }
  .tag { position: fixed; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; color: #fff;
    -webkit-text-stroke: 4px #1d2433; paint-order: stroke fill; white-space: nowrap; pointer-events: none; }
  .tag.prey { color: #8ef05a; font-size: 17px; }
  .tag.danger { color: #ff5a4e; font-size: 17px; }
  .pop { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 26px; color: #fff;
    -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; pointer-events: none; animation: up .8s ease-out forwards; }
  @keyframes up { 0% { transform: translate(-50%, -50%) scale(.6); } 25% { transform: translate(-50%, -80%) scale(1.15); } 100% { transform: translate(-50%, -170%) scale(1); opacity: 0; } }
  #msg { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 900;
    color: #ffd23f; -webkit-text-stroke: 8px #1d2433; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #joy { position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;

  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: #fff; border: 3px solid #1d2433; }
  #overlay { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(20,40,70,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { background: #fff; border: 4px solid #1d2433; border-radius: 30px; padding: 26px 34px; text-align: center; width: 560px; max-width: 100%;
    box-shadow: 0 10px 0 #1d2433; max-height: 100%; overflow: auto; }
  .card h1 { margin: 0; font-size: 60px; letter-spacing: -1px; color: #2fd3b9; -webkit-text-stroke: 9px #1d2433; paint-order: stroke fill; line-height: 1.1; }
  .card p { font-size: 18px; line-height: 1.4; margin: 8px 0; }
  .card .small { font-size: 14px; color: #6b7385; }

  /* Ton-Knopf: liegt immer oben links, auch über dem Menü */
  #snd { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 18px; z-index: 5; pointer-events: auto; cursor: pointer;

  #snd .x, #snd.off .w { display: none; }

  #top { padding-left: 60px; }

  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } }
  #pct, #alive { display: none; }

  #feed { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 56px); left: 50%; transform: translateX(-50%); display: flex;

  .kf { background: #fff; border: 3px solid #1d2433; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 15px;

  @keyframes kfin { from { transform: translateY(-12px) scale(.8); opacity: 0; } }
  #combo { position: fixed; left: 50%; top: 29%; transform: translate(-50%, -50%); font-weight: 900; font-size: 36px; color: #ff7ac6;
    -webkit-text-stroke: 7px #1d2433; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #combo.on { opacity: 1; }
  #combo.bump { animation: bump .35s ease-out; }
  @keyframes bump { 40% { transform: translate(-50%, -50%) scale(1.4) rotate(-5deg); } }
  #crown { position: fixed; width: 34px; transform: translate(-50%, -100%); pointer-events: none; display: none; }
  #crown svg, .pcrown svg { display: block; width: 100%; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  #msg.pop2 { animation: msgpop .45s ease-out; }
  @keyframes msgpop { 0% { transform: translate(-50%, -50%) scale(.4); } 60% { transform: translate(-50%, -50%) scale(1.12); } }
  /* Siegerpodest */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 12px 0 4px; }
  .pod { width: 130px; font-weight: 900; }
  .pod i { display: block; width: 46px; height: 46px; margin: 0 auto 4px; border-radius: 50%; border: 3px solid #1d2433; position: relative; }
  .pod i::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #1d2433; }
  .pod b { display: block; font-size: 17px; }
  .pod.me b { color: #0f9c86; }
  .pod small { display: block; font-size: 13px; color: #6b7385; margin-bottom: 4px; }
  .step { border: 3px solid #1d2433; border-bottom: 0; border-radius: 14px 14px 0 0; font-size: 30px; color: #fff;
    -webkit-text-stroke: 5px #1d2433; paint-order: stroke fill; padding-top: 6px; }
  .p1 .step { height: 92px; background: #ffd23f; }
  .p2 .step { height: 66px; background: #cfd6e0; }
  .p3 .step { height: 46px; background: #f0a868; }
  .pcrown { width: 44px; margin: 0 auto 2px; }
  .big { font-size: 66px; font-weight: 900; color: #2fd3b9; -webkit-text-stroke: 9px #1d2433; paint-order: stroke fill; line-height: 1.1; margin-top: 8px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .go.alt { background: #fff; color: #1d2433; -webkit-text-stroke: 0; }
</style>

  <path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.3 5.8a9 9 0 0 1 0 12.4" stroke="#1d2433" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path class="x" d="M15.5 9l6 6M21.5 9l-6 6" stroke="#ff5a4e" stroke-width="2.8" stroke-linecap="round"/></svg></button>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

// ================= Einstellungen =================
const MAP = 90;                                // Karte geht von -90 bis +90 (kompakt wie im Original)
const ROADS = [-60, -30, 0, 30, 60];
const BLOCKS = [-75, -45, -15, 15, 45, 75];
const ROUND_TIME = 120;                        // 2 Minuten wie im Original
const R0 = 0.6;                                // Startgröße des Lochs
const LEVEL = 1;
const INK = '#1d2433';                          // Konturfarbe

// Spielmodi
const MODES = {
  klassik: { label: 'Klassik', desc: 'Sammle in 2 Minuten die meisten Punkte. Wer geschluckt wird, ist nach 3 Sekunden wieder dabei.' },
  solo: { label: 'Solo', desc: 'Ohne Gegner: Schluck in 2 Minuten so viel von der Stadt wie möglich.' },
  battle: { label: 'Battle', desc: 'Wer geschluckt wird, ist raus. Das letzte Loch gewinnt, bei Zeitablauf zählen die Punkte.' },
};
const SOLO_STARS = [0.2, 0.35, 0.55];            // Anteil der Stadt für 1/2/3 Sterne im Solo-Modus
// Schwierigkeit: s0/s1 = Tempo der Gegner am Anfang/Ende der Anlaufzeit (ramp, Sekunden)
// huntDelay = ab wann sie dich im Klassik-Modus jagen, battleHunt = dasselbe im Battle-Modus
// stars = Punkte für 1/2/3 Sterne im Klassik-Modus, als Vielfaches des Stadtwerts (mit Combo geht es über 1 hinaus)
const DIFFS = {
  leicht: { label: 'Leicht', bots: 3, s0: 0.55, s1: 0.8, ramp: 90, huntPlayer: false, huntDelay: 999, battleHunt: 50, smart: 0.55,
    stars: [0.32, 0.95, 2.1], desc: 'Gegner bleiben gemütlich und jagen dich nie.',
    bdesc: 'Gegner bleiben gemütlich und jagen dich erst ab Sekunde 50.' },
  normal: { label: 'Normal', bots: 3, s0: 0.65, s1: 0.92, ramp: 60, huntPlayer: true, huntDelay: 40, battleHunt: 30, smart: 0.8,
    stars: [0.26, 0.74, 1.48], desc: 'Gegner starten langsam, werden flotter und jagen dich ab Sekunde 40.',
    bdesc: 'Gegner starten langsam, werden flotter und jagen dich ab Sekunde 30.' },
  schwer: { label: 'Schwer', bots: 4, s0: 0.75, s1: 0.95, ramp: 40, huntPlayer: true, huntDelay: 25, battleHunt: 20, smart: 0.9,
    stars: [0.21, 0.53, 1.05], desc: '4 Gegner, schnell auf Tempo, jagen dich schon ab Sekunde 25.',
    bdesc: '4 Gegner, schnell auf Tempo, jagen dich ab Sekunde 20.' },
};
const SKINS = [
  { id: 'minze', name: 'Minze', stars: 0, cols: ['#2fd3b9'] },
  { id: 'koralle', name: 'Koralle', stars: 1, cols: ['#ff5a4e'] },
  { id: 'gold', name: 'Gold', stars: 3, cols: ['#ffd23f', '#ff9f1c'], spin: 0.6 },
  { id: 'bonbon', name: 'Bonbon', stars: 5, cols: ['#ff7ac6', '#9b6bff'], spin: 0.8 },
  { id: 'regenbogen', name: 'Regenbogen', stars: 8, rainbow: true, spin: 1 },
  { id: 'lava', name: 'Lava', stars: 12, cols: ['#ff3d00', '#ffb300', '#ff3d00', '#ffe066'], spin: 1.6, pulse: true },
  { id: 'galaxie', name: 'Galaxie', stars: 16, cols: ['#6a5cff', '#00e5ff', '#ff4fd8'], spin: 1.2, pulse: true },
];
const BOTS = [['Mampf', '#ff8a3d'], ['Schlürf', '#ffd23f'], ['Krümel', '#9b6bff'], ['Happs', '#4f8bff']];
const TIERS = [[0.6, 'Kanaldeckel'], [1.2, 'Gully'], [2.2, 'Krater'], [4.5, 'Schlund'], [8, 'Abgrund'], [11, 'Schwarzes Loch'], [999, '']];
// Stufen: ab welchem Loch-Radius welche Objekte reinpassen (Radius = Schluckgröße / 0,95)
const STAGES = [[0.6, 'Kleinkram & Menschen'], [0.7, 'Laternen & Bänke'], [0.95, 'Büsche'], [1.5, 'Autos'], [1.75, 'Bäume'],
  [2.35, 'Brunnen & Gartenhäuser'], [4.95, 'Häuser'], [8.5, 'Wohnblöcke'], [10.55, 'Endboss']];
let GROWTH = 0.165;
let GROWTH_EXP = 0.55;
const radiusFor = m => R0 + GROWTH * Math.pow(m, GROWTH_EXP);
const massFor = r => r <= R0 ? 0 : Math.pow((r - R0) / GROWTH, 1 / GROWTH_EXP);   // Umkehrung: welche Masse für Radius r
let shownStage = -1;

// ================= Speicher (nur lokal auf dem Gerät) =================
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('lochfrass-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('lochfrass-' + k, JSON.stringify(v)); } catch {} },
};
// Sterne: Klassik und Battle je Schwierigkeit, Solo einmal → 21 Sterne pro Welt
const starKey = (m, d) => m === 'solo' ? `stars-${LEVEL}-solo` : m === 'battle' ? `stars-${LEVEL}-battle-${d}` : `stars-${LEVEL}-${d}`;
const starsOf = (m, d) => LS.get(starKey(m, d), 0);
const modeMax = m => m === 'solo' ? 3 : Object.keys(DIFFS).length * 3;
const modeStars = m => m === 'solo' ? starsOf('solo') : Object.keys(DIFFS).reduce((s, d) => s + starsOf(m, d), 0);
const totalStars = () => Object.keys(MODES).reduce((s, m) => s + modeStars(m), 0);
const MAX_STARS = Object.keys(MODES).reduce((s, m) => s + modeMax(m), 0);
let modeKey = LS.get('mode', 'klassik'); if (!MODES[modeKey]) modeKey = 'klassik';
let diffKey = LS.get('diff', 'normal'); if (!DIFFS[diffKey]) diffKey = 'normal';
let skinId = LS.get('skin', 'minze');
if (!SKINS.some(s => s.id === skinId && s.stars <= totalStars())) skinId = 'minze';

// ================= Sound: wird im Browser erzeugt, keine Audio-Dateien =================
const SND = (() => {
  let ctx = null, out = null, noiseBuf = null, on = LS.get('sound', true), lastPlop = 0;
  // iPad: Ton darf erst nach einer Berührung starten, deshalb init() bei jedem Antippen
  function init() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC(); out = ctx.createGain(); out.gain.value = on ? 0.55 : 0; out.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running') ctx.resume();
  }
  const ok = () => ctx && on && ctx.state === 'running';
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!ok()) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, delay = 0) {
    if (!ok()) return;
    const t = ctx.currentTime + delay, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur + 0.05);
  }
  return {
    init,
    get on() { return on; },
    toggle() { on = !on; LS.set('sound', on); if (out) out.gain.value = on ? 0.55 : 0; },
    plop(v) {   // kleine Dinge klingen hell, größere tiefer
      const now = performance.now(); if (now - lastPlop < 55) return; lastPlop = now;

// ---------- Autos: Spur halten, an Kreuzungen abbiegen, am Kartenrand wenden ----------
const bez = (t, a, b, c, d) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };

function curve(sx, sz, dx, dz, ex, ez, nx, nz, k, end) {   // Kurve von S (Fahrtrichtung d) nach E (Fahrtrichtung n)

    + Math.hypot(c.x[3] - c.x[2], c.z[3] - c.z[2]) + Math.hypot(ex - sx, ez - sz)) / 2;

}

    p.x += (bez(cv.t, ...cv.x) - p.x) * k; p.z += (bez(cv.t, ...cv.z) - p.z) * k;
    o.g.rotation.set(0, Math.atan2(-bezD(cv.t, ...cv.z), bezD(cv.t, ...cv.x)), 0);
    if (cv.t >= 1) { Object.assign(c, cv.end); c.curve = null; c.decided = null; }
    return;

  if (X) { p.x = along; p.z += (lane - p.z) * kk; } else { p.z = along; p.x += (lane - p.x) * kk; }   // sanft zurück in die Spur
  o.g.rotation.set(0, Math.atan2(-dz, dx), 0);
  if (along * c.dir > MAP - 6) {   // Straße endet: wenden
    const ol = laneOf(c.ax, c.rc, -c.dir);
    c.curve = curve(p.x, p.z, dx, dz, X ? along : ol, X ? ol : along, -dx, -dz, 2.2, { dir: -c.dir }); c.pending = null; return;
  }
  if (c.pending) { if ((along - c.pending.at) * c.dir >= 0) { c.curve = c.pending.cv; c.pending = null; } return; }
  for (const r of ROADS) {   // Kreuzung voraus: geradeaus oder abbiegen?
    const ahead = (r - along) * c.dir;
    if (ahead <= 0 || ahead > 8 || r === c.decided) continue;
    c.decided = r;
    if (Math.random() < 0.35) {
      const nd = Math.random() < 0.5 ? 1 : -1, nAx = X ? 'z' : 'x', nl = laneOf(nAx, r, nd), ol = laneOf(c.ax, c.rc, c.dir);
      const kx = X ? nl : ol, kz = X ? ol : nl, nx = X ? 0 : nd, nz = X ? nd : 0;   // k = Schnittpunkt der beiden Spuren
      const sx = kx - dx * TURN_R, sz = kz - dz * TURN_R, at = X ? sx : sz;
      if ((at - along) * c.dir > 0.2)
        c.pending = { at, cv: curve(sx, sz, dx, dz, kx + nx * TURN_R, kz + nz * TURN_R, nx, nz, TURN_R * 0.55, { ax: nAx, rc: r, dir: nd }) };

// ---------- Physik light: Kippen, Verkanten, Verhaken ----------

let jamHintShown = false;

function startTip(o, h) {

}
// wie lang ist das Objekt in Kipprichtung? (ein Auto quer kippt anders als längs)
function effLen(o) {

  } else {
    const Leff = effLen(o);
    // Winkel, bei dem das andere Ende an die Wand stößt (mindestens 0,2 = sichtbar schräg)
    const jamA = (!o.slip && Leff > R) ? Math.max(0.2, Math.acos(clamp(R / Leff, 0, 1))) : 99;
    o.thv += (3 + 6 * o.theta) * dt; o.theta += o.thv * dt;
    if (o.theta >= jamA) {                                // verkantet!
      o.theta = jamA; o.thv = 0;
      if (!o.jam && h.isPlayer && !jamHintShown) { jamHintShown = true; flash('Verkantet! Hin und her wackeln'); }
      o.jam = true;
      o.shake += h.speed * dt;
      o.wob = h.speed > 1 ? (Math.random() - 0.5) * 0.09 : 0;
      if (o.shake > 1.05 + Leff * 0.56) { o.slip = true; o.jam = false; }   // genug gewackelt (an das langsamere Loch angepasst)
    } else {
      o.jam = false; o.wob = 0;
      const k = Math.min(1, dt * (0.6 + o.theta)) * 0.5;  // rutscht Richtung Mitte
      b.x += (o.cx - b.x) * k; b.z += (o.cz - b.z) * k;
    }
    if (o.theta > 1.2) { applyTip(o); o.vy = -3; startFall(o, h); return; }
  }
  applyTip(o);
}
// dreht das Objekt um den Punkt an der Lochkante
function applyTip(o) {
  const [ux, uz] = o.dir;
  _pv.set(o.cx + ux * o.R, 0, o.cz + uz * o.R);
  _ax.set(-uz, 0, ux);
  _qt.setFromAxisAngle(_ax, o.theta + o.wob);
  o.g.quaternion.copy(_qt).multiply(o.yawQ);
  o.g.position.copy(_tv.copy(o.base).sub(_pv).applyQuaternion(_qt).add(_pv));
}

function updateVisuals(dt, now) {
  for (const h of holes) {
    h.grp.position.set(h.x, 0, h.z); h.grp.scale.set(h.rShow, 1, h.rShow);
    if (h.skin.spin) { h.rim.rotation.z += dt * h.skin.spin; h.glow.rotation.z = h.rim.rotation.z; }
    h.pulse = Math.max(0, h.pulse - dt * 3);   // Rand pulst kurz beim Schlucken
    const ps = 1 + 0.12 * h.pulse, gs = ps * (1 + 0.12 * h.pulse);
    h.rim.scale.set(ps, ps, 1); h.glow.scale.set(gs, gs, 1);
    h.glow.material.opacity = h.skin.pulse ? 0.55 + 0.45 * Math.sin(now / 180) : 1;
  }
  const zoom = 0.85 + player.rShow * 0.3;
  camera.position.lerp(new THREE.Vector3(player.x, 14 * zoom, player.z + 7 * zoom), Math.min(1, dt * 3));
  camLook.lerp(new THREE.Vector3(player.x, 0, player.z - 0.5), Math.min(1, dt * 5));
  camera.lookAt(camLook);
  if (shakeT > 0) { shakeT -= dt; const a = shakeA * Math.min(1, shakeT / 0.25) * zoom;
    camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; if (shakeT <= 0) shakeA = 0; }
  updatePuffs(dt);
  if (waveT > 0) {   // Welle beim Stufenaufstieg
    waveT -= dt; const kw = 1 - Math.max(0, waveT) / 0.7, s = player.rShow * (1.15 + kw * 1.8);
    wave.visible = waveT > 0; wave.position.set(player.x, 0.1, player.z); wave.scale.set(s, s, 1); waveMat.opacity = 0.9 * (1 - kw);
  }
  // Krone über dem Loch mit den meisten Punkten
  const cr = $('crown');
  if (running && leader && leader.alive) {
    const p = new THREE.Vector3(leader.x, 0.5, leader.z - leader.rShow).project(camera);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    cr.style.display = vis ? 'block' : 'none';
    cr.style.left = (p.x + 1) / 2 * innerWidth + 'px'; cr.style.top = (1 - p.y) / 2 * innerHeight - (leader.isPlayer ? 2 : 22) + 'px';
  } else cr.style.display = 'none';
  // Pfeil zum Endboss, sobald du groß genug bist und er nicht im Bild ist
  const arrow = $('arrow');
  if (running && !bossEaten && player.rShow >= BOSS.s / 0.95) {
    const bp = new THREE.Vector3(BOSS.g.position.x, 0, BOSS.g.position.z).project(camera);
    const cx = innerWidth / 2, cy = innerHeight / 2;
    let vx = (bp.x + 1) / 2 * innerWidth - cx, vy = (1 - bp.y) / 2 * innerHeight - cy;
    if (bp.z > 1) { vx = -vx; vy = -vy; }
    const onScreen = bp.z < 1 && Math.abs(vx) < cx - 60 && Math.abs(vy) < cy - 60;
    if (onScreen) arrow.style.display = 'none';
    else { const k = Math.min((cx - 60) / Math.abs(vx || 1), (cy - 70) / Math.abs(vy || 1));
      arrow.style.display = 'block'; arrow.style.left = cx + vx * k + 'px'; arrow.style.top = cy + vy * k + 'px';
      arrow.firstElementChild.style.transform = `rotate(${Math.atan2(vy, vx)}rad)`; }
  } else arrow.style.display = 'none';
  // Schatten-Bereich folgt dem Spieler (schärfere Schatten als über die ganze Karte)
  const ext = Math.round(28 + player.rShow * 4);
  const sc = sun.shadow.camera;
  if (sc.right !== ext) { sc.left = sc.bottom = -ext; sc.right = sc.top = ext; sc.updateProjectionMatrix(); }
  sun.position.set(player.x + 35, 70, player.z + 25); sun.target.position.set(player.x, 0, player.z);
  // Häuser zwischen Kamera und Loch durchsichtig machen
  const H = camera.position.y, Dz = Math.max(1, camera.position.z - player.z);
  for (const o of objects) {
    if (!o.mats) continue;
    const p = o.g.position, dz = p.z - player.z;
    const lineH = H * Math.max(0, dz - o.r) / Dz;
    const block = !o.falling && dz > -o.r && dz < Dz + o.r && o.h > lineH && Math.abs(p.x - player.x) < o.r + player.rShow + (o.boss ? 10 : 1.5);
    const target = block ? 0.3 : 1;
    if (Math.abs(o.fade - target) < 0.01) continue;
    o.fade += (target - o.fade) * Math.min(1, dt * 8);
    if (Math.abs(o.fade - target) < 0.01) o.fade = target;
    for (const m of o.mats) { m.transparent = o.fade < 1; m.opacity = o.fade; m.depthWrite = o.fade >= 1; m.userData = o.fade < 1 ? NO_OUTLINE : {}; }
  }
  for (const b of bots) {
    if (!b.alive) { b.tag.style.display = 'none'; continue; }
    const p = new THREE.Vector3(b.x, 0.5, b.z - b.rShow).project(camera);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    b.tag.style.display = vis ? 'block' : 'none';
    b.tag.style.left = (p.x + 1) / 2 * innerWidth + 'px'; b.tag.style.top = (1 - p.y) / 2 * innerHeight + 'px';
    // grün = Beute (du kannst es schlucken), rot = Gefahr (es kann dich schlucken)
    const rel = !player.alive ? '' : player.rShow >= b.rShow * 1.25 ? 'prey' : b.rShow >= player.rShow * 1.25 ? 'danger' : '';
    if (rel !== b.rel) { b.rel = rel; b.tag.className = 'tag ' + rel; }
  }
}

function podium(ranked, sub) {   // Siegerpodest: Platz 2 links, 1 in der Mitte, 3 rechts
  return `<div class="podium">${[1, 0, 2].filter(i => ranked[i]).map(i => { const h = ranked[i];
    return `<div class="pod p${i + 1} ${h.isPlayer ? 'me' : ''}">${i === 0 ? `<div class="pcrown">${CROWN}</div>` : ''}
      <i style="background:${skinCss(h.skin)}"></i><b>${h.name}</b><small>${sub(h)}</small><div class="step">${i + 1}</div></div>`; }).join('')}</div>`;
}
function endRound() {
  if (!running) return;
  running = false; drag.on = false; joy.style.display = 'none'; hideCombo(); $('crown').style.display = 'none';
  const solo = modeKey === 'solo', battle = modeKey === 'battle';
  const ranked = battle ? [...holes.filter(h => !h.out).sort((a, b) => b.score - a.score), ...holes.filter(h => h.out).sort((a, b) => a.place - b.place)]
    : [...holes].sort((a, b) => b.score - a.score);
  const place = ranked.indexOf(player) + 1, pct = eatenValue / TOTAL_VALUE;
  let stars, rule;
  if (solo) { stars = SOLO_STARS.filter(f => pct >= f).length; rule = 'Sterne ab ' + SOLO_STARS.map(f => Math.round(f * 100) + '%').join(' / '); }
  else if (battle) { stars = place === 1 ? (player.kills >= 2 ? 3 : 2) : place === 2 ? 1 : 0; rule = '★ Top 2 · ★★ Sieg · ★★★ Sieg mit 2 Kills'; }
  else { const thr = starScores(); stars = thr.filter(s => player.score >= s).length; rule = 'Sterne ab ' + thr.join(' / ') + ' Punkten'; }
  const before = totalStars(), key = starKey(modeKey, diffKey), bestKey = key.replace('stars', 'best');
  if (stars > LS.get(key, 0)) LS.set(key, stars);
  const val = solo ? Math.floor(pct * 100) : player.score, best = Math.max(val, LS.get(bestKey, 0));
  LS.set(bestKey, best);
  const after = totalStars(), unlocked = SKINS.filter(s => s.stars > before && s.stars <= after);
  const title = battle ? (place === 1 ? 'Gewonnen!' : player.out ? 'Ausgeschieden!' : 'Zeit um!') : 'Zeit um!';
  const kills = h => h.kills + (h.kills === 1 ? ' Kill' : ' Kills');
  const sub = battle ? h => h.out ? 'raus' : kills(h) : h => h.score + ' Punkte';
  card.innerHTML = `
    <h1>${title}</h1>
    ${solo ? `<div class="big">${Math.floor(pct * 100)}%</div><p>der Vorstadt geschluckt</p>` : podium(ranked, sub)}
    <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
    <p><b>${player.score} Punkte</b>${solo ? '' : ` · Platz ${place} von ${holes.length} · ${D.label}`}
      ${solo ? '' : `<br>${Math.floor(pct * 100)}% der Vorstadt geschluckt`}${bossEaten ? ' · Endboss besiegt!' : ''}
      ${battle && player.out ? `<br>${player.by.name} hat dich geschluckt` : ''}</p>
    ${unlocked.length ? `<div class="unlock">Neuer Skin: ${unlocked.map(s => s.name).join(', ')}!</div>` : ''}
    ${battle ? `<div id="ranks">${ranked.map((h, i) => `<div><span>${i + 1}. ${h.name}</span><span>${h.out ? (h.by.isPlayer ? 'von dir' : 'von ' + h.by.name) + ' geschluckt' : kills(h)}</span></div>`).join('')}</div>` : ''}
    <p class="small">Bestwert ${best}${solo ? '%' : ''} · ${rule}</p>
    <div class="btns"><button class="go" id="again">Nochmal</button><button class="go alt" id="menu">Menü</button></div>`;
  // Neustart = Seite neu laden (frische Stadt); „Nochmal“ startet danach sofort wieder
  $('again').onclick = () => { try { sessionStorage.setItem('lochfrass-auto', '1'); } catch {} location.reload(); };
  $('menu').onclick = () => location.reload();
  $('overlay').style.display = 'flex';
  SND.jingle(stars);
}

let autoStart = false;
try { autoStart = !!sessionStorage.getItem('lochfrass-auto'); sessionStorage.removeItem('lochfrass-auto'); } catch {}
if (autoStart) startGame(); else renderStart();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) update(dt);
  updateVisuals(dt, now);
  if ((hudT -= dt) <= 0) { updateHud(); hudT = 0.1; }
  effect.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// Test-Helfer: __lf.mode('solo') wählt den Modus, __lf.sim(120, true) spielt eine Runde im Schnelldurchlauf mit Autopilot
window.__lf = { player, holes, objects, TOTAL, TOTAL_VALUE, starScores, setGrowth: (g, e = GROWTH_EXP) => { GROWTH = g; GROWTH_EXP = e; },
  mode(m, d = diffKey) { modeKey = m; diffKey = d; D = DIFFS[d]; },
  ap(speed = 1, smart = 1) { AP.speed = speed; AP.smart = smart; },
  sim(sec, auto = false) {
    autopilot = auto; if (!running) startGame();
    const reach = {};   // wann welche Stufe erreicht wurde (Sekunden)
    for (let t = 0; t < sec && running; t += 1 / 30) {
      update(1 / 30);
      for (let s = 1; s < STAGES.length; s++) if (!reach[s] && player.mass >= massFor(STAGES[s][0])) reach[s] = Math.round(elapsed);
    }
    autopilot = false;
    return { t: Math.round(elapsed), score: player.score, pct: Math.round(eatenValue / TOTAL_VALUE * 100), r: player.r.toFixed(2), kills: player.kills,
      stages: Object.entries(reach).map(([s, t]) => STAGES[s][1].split(/[ &]/)[0] + ' ' + t).join(', '),
      bots: bots.map(b => b.name + ':' + b.score + (b.out ? ' raus' : '')), stars: starScores(), total: TOTAL_VALUE };
  } };
</script>
</body>
